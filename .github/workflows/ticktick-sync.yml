name: ticktick-sync

# TickTick has no webhooks, so the sync polls. Vercel Hobby cron is daily-only,
# and this repo is public so Actions minutes are free — hence the schedule lives
# here and calls the cron route.
on:
  schedule:
    # Hourly at :23 — off the hour to avoid the scheduler pileup at :00.
    #
    # This asked for every 10 minutes until 2026-08-11. GitHub delivered 9 runs
    # in the 8.6 hours after the schedule went live, against the ~51 it implied:
    # an average gap of 65 minutes. The tighter cron bought nothing and only made
    # the workflow describe a cadence it never got. Each run reconciles a 7-day
    # lookback (TICKTICK_LOOKBACK_DAYS), so hourly cannot miss a task either way.
    - cron: '23 * * * *'
  workflow_dispatch:

# A run in flight is more useful than a queue of stale ones.
concurrency:
  group: ticktick-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger TickTick sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://time-tracker-cyan-tau.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets."
            exit 1
          fi

          # Not using curl -f: it discards the body, and the body is the sync summary.
          status=$(curl -sS -m 55 -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/ticktick-sync")

          echo "HTTP $status"
          cat response.json || true
          echo

          if [ "$status" != "200" ]; then
            echo "::error::TickTick sync failed with HTTP $status"
            exit 1
          fi

          # TickTick issues no refresh token, so the access token eventually dies
          # and only a human can renew it. Surface the countdown loudly.
          token_state=$(grep -o '"tokenState":"[^"]*"' response.json | cut -d'"' -f4 || true)
          days=$(grep -o '"tokenExpiresInDays":[-0-9]*' response.json | cut -d: -f2 || true)
          if [ "$token_state" = "expiring_soon" ]; then
            echo "::warning::TickTick access token expires in ${days} day(s). Run: npm run ticktick:spike && npm run ticktick:seed"
          fi

# The keepalive that guards against GitHub's 60-day disable lives in its own
# weekly workflow. It used to be a second job here, which meant a keepalive
# problem showed up as a failed *sync* run — see .github/workflows/keepalive.yml.
